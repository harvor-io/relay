name: Deploy

on:
  # Runs after CI finishes on main, rather than in parallel with it, so a
  # broken main never gets deployed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Resolve commit
        id: commit
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-tags: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        run: |
          SHA="${{ steps.commit.outputs.sha }}"
          TAGS="ghcr.io/${{ github.repository }}:latest"$'\n'"ghcr.io/${{ github.repository }}:$SHA"
          if [ "${{ github.event_name }}" = "release" ]; then
            GIT_TAG="${{ github.event.release.tag_name }}"
          else
            GIT_TAG=$(git tag --points-at HEAD | head -n1)
          fi
          if [ -n "$GIT_TAG" ]; then
            TAGS="$TAGS"$'\n'"ghcr.io/${{ github.repository }}:$GIT_TAG"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
