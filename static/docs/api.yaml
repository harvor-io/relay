openapi: 3.0.3
info:
  title: Relay API
  description: >-
    API for the Relay event routing service.


    ## Stability


    Every endpoint carries an Exalynt
    [stability level](https://readme.exalynt.com/how-it-works/stability-levels):
    Prototype, Alpha, Beta, or GA. Below GA it shows as a mark beside the
    endpoint and in the navigation, which says what to expect when you hover,
    focus, or tap it, and every endpoint states it in its `x-stability`
    field. Each group of endpoints shows its
    [maturity](https://readme.exalynt.com/how-it-works/maturity) in the
    navigation: how stable its endpoints are on average.


    Most endpoints are **Alpha** today. They work, but are still taking
    shape: expect frequent breaking changes, sometimes without notice, and
    bugs, even in the main workflow. Build on them to experiment, and keep a
    fallback for anything you rely on. The Destinations and Subscriptions
    endpoints are **Prototype**: they register destinations and subscribe
    them to topics, but nothing is delivered to them yet. Endpoints move up a
    level as they settle, and only GA endpoints promise no breaking changes
    within `/v1`.
  version: 0.1.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Health
    description: Service availability checks.
  - name: Sources
    description: Origins that relay ingests data from.
  - name: Source Keys
    description: HMAC credentials used to verify signed requests from a Source.
  - name: Destinations
    description: Targets that relay forwards ingested data to.
  - name: Subscriptions
    description: The topics and patterns of events that a destination wants.
