openapi: 3.0.3
info:
  title: Relay API
  description: >-
    API for the Relay event routing service. The service is currently an
    HTTP skeleton; endpoints are being built incrementally.
  version: 0.1.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
tags:
  - name: Health
    description: Service availability checks.
  - name: Sources
    description: Origins that relay ingests data from.
  - name: Source Keys
    description: HMAC credentials used to verify signed requests from a Source.
paths:
  /healthz:
    $ref: "./paths/health/healthz.yml"
  /sources:
    $ref: "./paths/sources/sources.yml"
  /sources/{id}:
    $ref: "./paths/sources/source.yml"
  /sources/{id}/keys:
    $ref: "./paths/sources/keys/keys.yml"
  /sources/{id}/keys/{keyID}:
    $ref: "./paths/sources/keys/key.yml"
  /sources/{id}/keys/{keyID}/activate:
    $ref: "./paths/sources/keys/activate.yml"
  /sources/{id}/keys/{keyID}/deactivate:
    $ref: "./paths/sources/keys/deactivate.yml"
