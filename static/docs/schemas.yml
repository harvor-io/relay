components:
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Human-readable process status.
          example: OK

    Source:
      type: object
      required:
        - id
        - name
        - slug
        - description
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Stable unique identifier (UUIDv7).
          example: 0192a5c8-1f4e-7c3a-9b2d-3e4f5a6b7c8d
        name:
          type: string
          description: Human-readable label for the source.
          example: orders
        slug:
          type: string
          description: URL-safe identifier, unique across sources.
          example: orders
        description:
          type: string
          nullable: true
          description: Optional free-form explanation, or null when unset.
          example: Order events from the storefront.
        is_active:
          type: boolean
          description: Whether the source currently accepts ingested events.
        created_at:
          type: string
          format: date-time
          description: When the source was registered.
        updated_at:
          type: string
          format: date-time
          description: When the source was last modified.

    NewSource:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Optional client-supplied UUID for the source. When omitted, a
            UUIDv7 is generated. When supplied, it must not already belong to
            another source.
          example: 0192a5c8-1f4e-7c3a-9b2d-3e4f5a6b7c8d
        name:
          type: string
          description: Human-readable label for the source. Required.
          example: orders
        slug:
          type: string
          description: >-
            Optional URL-safe identifier (lowercase letters, digits, hyphens,
            underscores). When omitted, a unique slug is derived from the name.
            When supplied, it must be URL-safe and not already in use.
          example: orders
        description:
          type: string
          nullable: true
          description: Optional free-form explanation.
          example: Order events from the storefront.

    UpdateSource:
      type: object
      properties:
        name:
          type: string
          description: >-
            New human-readable label for the source. Omit to leave the name
            unchanged.
          example: orders
        description:
          type: string
          nullable: true
          description: >-
            New free-form explanation. Omit to leave the description
            unchanged; a value that is empty after trimming clears it.
          example: Order events from the storefront.

    SourceKey:
      type: object
      required:
        - id
        - source_id
        - name
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Stable unique identifier for the key (UUIDv7).
          example: 0192a5c8-2a5f-7b3c-8d1e-4f5a6b7c8d9e
        source_id:
          type: string
          format: uuid
          description: The source this key belongs to.
          example: 0192a5c8-1f4e-7c3a-9b2d-3e4f5a6b7c8d
        name:
          type: string
          description: Human-readable label for the key.
          example: primary
        is_active:
          type: boolean
          description: Whether the key is currently accepted for verifying signed requests.
        created_at:
          type: string
          format: date-time
          description: When the key was created.
        updated_at:
          type: string
          format: date-time
          description: When the key was last modified.

    NewSourceKey:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Optional client-supplied UUID for the key. When omitted, a
            UUIDv7 is generated. When supplied, it must not already belong to
            another key.
          example: 0192a5c8-2a5f-7b3c-8d1e-4f5a6b7c8d9e
        name:
          type: string
          description: Human-readable label for the key. Required.
          example: primary

    CreatedSourceKey:
      description: >-
        A newly created source key, together with its plaintext secret. The
        secret is only ever returned in this response; it is encrypted at
        rest and cannot be retrieved again.
      allOf:
        - $ref: "#/components/schemas/SourceKey"
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
              description: >-
                The key's secret, hex-encoded. Store it now; it cannot be
                retrieved again.
              example: 9f2b1c...4a7e

    Destination:
      type: object
      required:
        - id
        - name
        - type
        - config
        - description
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Stable unique identifier (UUIDv7).
          example: 0192a5c8-3b6f-7d4a-9c2e-4f5a6b7c8d9e
        name:
          type: string
          description: Human-readable label for the destination.
          example: warehouse
        type:
          type: string
          enum:
            - webhook
          description: >-
            The destination's delivery mechanism. Fixed at creation time;
            "webhook" is currently the only supported type.
          example: webhook
        config:
          description: >-
            The type-specific delivery configuration, fixed at creation time.
            Its shape depends on type; for "webhook", see WebhookConfig.
          oneOf:
            - $ref: "#/components/schemas/WebhookConfig"
        description:
          type: string
          nullable: true
          description: Optional free-form explanation, or null when unset.
          example: Batched delivery of order events to the data warehouse.
        is_active:
          type: boolean
          description: Whether the destination currently accepts deliveries.
        created_at:
          type: string
          format: date-time
          description: When the destination was registered.
        updated_at:
          type: string
          format: date-time
          description: When the destination was last modified.

    NewDestination:
      type: object
      required:
        - name
        - config
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Optional client-supplied UUID for the destination. When omitted,
            a UUIDv7 is generated. When supplied, it must not already belong
            to another destination.
          example: 0192a5c8-3b6f-7d4a-9c2e-4f5a6b7c8d9e
        name:
          type: string
          description: Human-readable label for the destination. Required.
          example: warehouse
        type:
          type: string
          enum:
            - webhook
          description: >-
            The destination's delivery mechanism. Optional; defaults to
            "webhook", currently the only supported type.
          example: webhook
        config:
          description: >-
            The type-specific delivery configuration. Required; its shape
            depends on type. For "webhook", see NewWebhookConfig.
          oneOf:
            - $ref: "#/components/schemas/NewWebhookConfig"
        description:
          type: string
          nullable: true
          description: Optional free-form explanation.
          example: Batched delivery of order events to the data warehouse.

    NewWebhookConfig:
      description: >-
        The config accepted for a new "webhook" destination. Shaped like
        WebhookConfig, except auth carries the plaintext secret to store
        rather than a reference to it.
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The HTTP endpoint envelopes are delivered to.
          example: https://example.com/webhook
        auth:
          $ref: "#/components/schemas/NewAuthConfig"

    NewAuthConfig:
      description: >-
        Authentication to apply to outbound webhook requests. Omit entirely
        to call the webhook without authentication.
      type: object
      required:
        - type
        - config
      properties:
        type:
          type: string
          enum:
            - hmac
          description: >-
            The authentication scheme. "hmac" is currently the only
            supported type.
          example: hmac
        config:
          description: >-
            The scheme-specific configuration; its shape depends on type.
            For "hmac", see NewHMACAuthConfig.
          oneOf:
            - $ref: "#/components/schemas/NewHMACAuthConfig"

    NewHMACAuthConfig:
      description: >-
        The config accepted for a new "hmac" auth config. The plaintext
        secret is encrypted and stored in the secrets store; it is never
        persisted verbatim or returned in a response. Shaped like
        HMACAuthConfig, with secret in place of secret_id.
      type: object
      required:
        - secret
        - algorithm
        - signature_header
        - encoding
        - signing_template
        - timestamp_header
      properties:
        secret:
          type: string
          description: >-
            The plaintext HMAC signing secret. Store it yourself; it is
            never returned by the API again.
          example: 9f2b1c...4a7e
        algorithm:
          type: string
          description: The HMAC hash algorithm.
          example: sha256
        signature_header:
          type: string
          description: The HTTP header the computed signature is sent in.
          example: X-Signature
        encoding:
          type: string
          description: How the signature bytes are encoded into the header.
          example: hex
        signing_template:
          type: string
          description: Describes what is signed.
          example: "{timestamp}.{body}"
        timestamp_header:
          type: string
          description: >-
            The HTTP header the request timestamp is sent in, referenced by
            signing_template.
          example: X-Timestamp

    WebhookConfig:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The HTTP endpoint envelopes are delivered to.
          example: https://example.com/webhook
        auth:
          $ref: "#/components/schemas/AuthConfig"

    AuthConfig:
      description: >-
        Authentication applied to outbound webhook requests. Omit entirely
        to call the webhook without authentication.
      type: object
      required:
        - type
        - config
      properties:
        type:
          type: string
          enum:
            - hmac
          description: >-
            The authentication scheme. "hmac" is currently the only
            supported type.
          example: hmac
        config:
          description: >-
            The scheme-specific configuration; its shape depends on type.
            For "hmac", see HMACAuthConfig.
          oneOf:
            - $ref: "#/components/schemas/HMACAuthConfig"

    HMACAuthConfig:
      type: object
      required:
        - secret_id
        - algorithm
        - signature_header
        - encoding
        - signing_template
        - timestamp_header
      properties:
        secret_id:
          type: string
          description: >-
            References the HMAC secret held in the secrets store. Assigned
            by the server when the destination was created from the
            plaintext secret supplied in NewHMACAuthConfig; the plaintext is
            never returned.
          example: abc123
        algorithm:
          type: string
          description: The HMAC hash algorithm.
          example: sha256
        signature_header:
          type: string
          description: The HTTP header the computed signature is sent in.
          example: X-Signature
        encoding:
          type: string
          description: How the signature bytes are encoded into the header.
          example: hex
        signing_template:
          type: string
          description: Describes what is signed.
          example: "{timestamp}.{body}"
        timestamp_header:
          type: string
          description: >-
            The HTTP header the request timestamp is sent in, referenced by
            signing_template.
          example: X-Timestamp

    UpdateDestination:
      type: object
      properties:
        name:
          type: string
          description: >-
            New human-readable label for the destination. Omit to leave the
            name unchanged.
          example: warehouse
        description:
          type: string
          nullable: true
          description: >-
            New free-form explanation. Omit to leave the description
            unchanged; a value that is empty after trimming clears it.
          example: Batched delivery of order events to the data warehouse.

    Envelope:
      type: object
      required:
        - id
        - source_id
        - source
        - type
        - topic
        - data
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Stable unique identifier (UUIDv7).
          example: 0192a5c8-4c7f-7e5b-9d3f-5a6b7c8d9e0f
        source_id:
          type: string
          format: uuid
          description: The source that produced this envelope.
          example: 0192a5c8-1f4e-7c3a-9b2d-3e4f5a6b7c8d
        source:
          type: string
          description: >-
            The slug of the originating source, captured at the time the
            envelope was created so it remains stable even if the source is
            later renamed.
          example: orders
        type:
          type: string
          description: >-
            The kind of event this envelope carries within its source.
            Combined with source, it forms the topic ("<source>.<type>")
            used to route the envelope to destinations.
          example: order.created
        topic:
          type: string
          description: >-
            The routing key for this envelope, derived as "<source>.<type>".
            Determines which destinations receive it.
          example: orders.order.created
        data:
          description: The event payload, exactly as submitted.
          example:
            order_id: 42
        created_at:
          type: string
          format: date-time
          description: When the envelope was accepted into relay.

    NewSourceEvent:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          description: >-
            The kind of event being submitted. Combined with the source's
            slug, this forms the topic used to route the resulting envelope
            to destinations ("<source>.<type>"). Must contain only
            alphanumeric characters, ".", "_", or "-", with no spaces. It is
            recommended to shape this as "<thing>.<action>", e.g.
            "order.created" or "user.updated".
          example: order.created
        data:
          description: The event payload. Required; may be any JSON value.
          example:
            order_id: 42
        envelope_id:
          type: string
          format: uuid
          description: >-
            Optional client-supplied UUID for the resulting envelope, useful
            for making submission idempotent (e.g. keying it off an event ID
            already used upstream). When omitted, a UUIDv7 is generated.
            When supplied, it must not already belong to another envelope.
          example: 0192a5c8-4c7f-7e5b-9d3f-5a6b7c8d9e0f

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
