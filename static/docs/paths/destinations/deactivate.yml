parameters:
  - name: id
    in: path
    required: true
    description: The destination's UUID.
    schema:
      type: string
      format: uuid

post:
  operationId: deactivateDestination
  x-stability: prototype
  summary: Deactivate a destination
  description: >-
    Marks the destination as inactive, without deleting it or its
    subscriptions. Events published while it's inactive are dropped for it,
    not held until it's activated again. Nothing is delivered to any
    destination yet.
  tags:
    - Destinations
  responses:
    "200":
      description: The updated destination.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Destination"
    "400":
      description: The ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"
    "404":
      description: No destination exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"
