parameters:
  - name: id
    in: path
    required: true
    description: The destination's UUID.
    schema:
      type: string
      format: uuid
  - name: topic
    in: path
    required: true
    description: >-
      The topic or pattern, such as `orders.order.created`, `orders.order.*`,
      `orders.*`, or `*`. A `*` may be sent as is or percent-encoded as `%2A`.
    schema:
      type: string
    example: orders.order.*

get:
  operationId: getSubscription
  x-stability: prototype
  summary: Get a subscription
  description: Returns the destination's subscription to the topic.
  tags:
    - Subscriptions
  responses:
    "200":
      description: The subscription.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Subscription"
    "400":
      description: The destination ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "404":
      description: The destination isn't subscribed to the topic.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"

put:
  operationId: putSubscription
  x-stability: prototype
  summary: Subscribe a destination to a topic
  description: >-
    Subscribes the destination to a topic or pattern. A topic is a source's
    slug, a `.`, and an event type, such as `orders.order.created`. A pattern
    ends in `*`, which matches one or more further parts: `orders.order.*` is
    every `order` event from `orders`, `orders.*` is everything from
    `orders`, and `*` alone is every event from every source. A `*` may only
    be the last part. The source needn't be registered, and the event type
    needn't have been published yet. Subscribing again changes nothing, so
    it's safe to retry. Nothing is delivered to destinations yet.
  tags:
    - Subscriptions
  responses:
    "200":
      description: The destination was already subscribed to the topic.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Subscription"
    "201":
      description: The destination is now subscribed to the topic.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Subscription"
    "400":
      description: The destination ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "404":
      description: No destination exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "422":
      description: The topic isn't a valid topic or pattern.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"

delete:
  operationId: deleteSubscription
  x-stability: prototype
  summary: Unsubscribe a destination from a topic
  description: >-
    Removes the subscription, so the destination no longer wants the topic's
    events. Its other subscriptions are untouched, even ones whose patterns
    also match this topic. Answers 204 whether or not the destination was
    subscribed, so it's safe to retry.
  tags:
    - Subscriptions
  responses:
    "204":
      description: The destination isn't subscribed to the topic.
    "400":
      description: The destination ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "404":
      description: No destination exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
