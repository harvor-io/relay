parameters:
  - name: id
    in: path
    required: true
    description: The destination's UUID.
    schema:
      type: string
      format: uuid

get:
  operationId: listSubscriptions
  x-stability: prototype
  summary: List a destination's subscriptions
  description: >-
    Returns a page of the destination's subscriptions, one per topic or
    pattern, ordered by topic. Follow the `Link` header's `next` link for the
    rest.
  tags:
    - Subscriptions
  parameters:
    - $ref: "../../../schemas.yml#/components/parameters/After"
    - $ref: "../../../schemas.yml#/components/parameters/Before"
    - $ref: "../../../schemas.yml#/components/parameters/Size"
  responses:
    "200":
      description: The list of subscriptions.
      headers:
        Link:
          $ref: "../../../schemas.yml#/components/headers/Link"
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../../schemas.yml#/components/schemas/Subscription"
    "400":
      description: >-
        The destination ID is not a valid UUID, or the page selection is
        invalid, such as a size out of range or a cursor from another listing.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "404":
      description: No destination exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"

put:
  operationId: replaceSubscriptions
  x-stability: prototype
  summary: Replace a destination's subscriptions
  description: >-
    Makes the destination's subscriptions exactly these topics and patterns,
    in one call: it subscribes to the ones it isn't subscribed to and
    unsubscribes from every one this list leaves out. An empty list
    unsubscribes from everything. Every topic follows the same rules as
    subscribing to one, and if any is invalid, nothing changes. Sending the
    same list again changes nothing, so it's safe to retry. To add or remove
    one topic without restating the rest, use the single subscription
    endpoints instead.
  tags:
    - Subscriptions
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../schemas.yml#/components/schemas/ReplaceSubscriptions"
  responses:
    "204":
      description: The destination's subscriptions are now exactly these topics.
    "400":
      description: The destination ID is not a valid UUID, or the request body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "404":
      description: No destination exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "422":
      description: The topics list is missing, or a topic is invalid.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
