parameters:
  - name: id
    in: path
    required: true
    description: The key's UUID.
    schema:
      type: string
      format: uuid

get:
  operationId: getSourceKey
  x-stability: alpha
  summary: Get a source key
  description: Returns a single source key.
  tags:
    - Source Keys
  responses:
    "200":
      description: The key.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/SourceKey"
    "400":
      description: The ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"
    "404":
      description: No key exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"

delete:
  operationId: deleteSourceKey
  x-stability: alpha
  summary: Delete a source key
  description: Removes a key and its underlying secret.
  tags:
    - Source Keys
  responses:
    "204":
      description: The key was deleted.
    "400":
      description: The ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"
    "404":
      description: No key exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"
