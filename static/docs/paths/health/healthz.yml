get:
  operationId: getHealth
  x-stability: alpha
  summary: Check health
  description: >-
    Reports the process's servers, their dependencies, and the external
    providers they use, for people and monitoring rather than probes. Relay
    uses no external providers yet, so today this reports what `/readyz`
    does. Results are cached for a second.
  tags:
    - Health
  # Public: people and monitoring reach this without a token.
  security: []
  responses:
    "200":
      description: Everything checked is up.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Health"
    "503":
      description: Something checked is down.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Health"
