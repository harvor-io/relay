parameters:
  - name: id
    in: path
    required: true
    description: The source's UUID.
    schema:
      type: string
      format: uuid

get:
  operationId: getSource
  summary: Get a source
  description: Returns a single source by ID.
  tags:
    - Sources
  responses:
    "200":
      description: The source.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Source"
    "400":
      description: The ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"
    "404":
      description: No source exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"

delete:
  operationId: deleteSource
  summary: Delete a source
  description: Removes a source by ID.
  tags:
    - Sources
  responses:
    "204":
      description: The source was deleted.
    "400":
      description: The ID is not a valid UUID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"
    "404":
      description: No source exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../schemas.yml#/components/schemas/Error"
