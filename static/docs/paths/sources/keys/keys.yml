parameters:
  - name: id
    in: path
    required: true
    description: The source's UUID.
    schema:
      type: string
      format: uuid

get:
  operationId: listSourceKeys
  x-stability: alpha
  summary: List a source's keys
  description: >-
    Returns a page of the source's keys, ordered by name. Follow the `Link`
    header's `next` link for the rest.
  tags:
    - Source Keys
  parameters:
    - $ref: "../../../schemas.yml#/components/parameters/After"
    - $ref: "../../../schemas.yml#/components/parameters/Before"
    - $ref: "../../../schemas.yml#/components/parameters/Size"
  responses:
    "200":
      description: The list of keys.
      headers:
        Link:
          $ref: "../../../schemas.yml#/components/headers/Link"
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../../schemas.yml#/components/schemas/SourceKey"
    "400":
      description: >-
        The source ID is not a valid UUID, or the page selection is invalid,
        such as a size out of range or a cursor from another listing.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "404":
      description: No source exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"

post:
  operationId: createSourceKey
  x-stability: alpha
  summary: Create a source key
  description: >-
    Generates a new key for the source. The response includes the plaintext
    secret exactly once; it is encrypted at rest and cannot be retrieved
    again, so callers must store it when it is returned. When no ID is
    supplied, a UUIDv7 is generated.
  tags:
    - Source Keys
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../schemas.yml#/components/schemas/NewSourceKey"
  responses:
    "201":
      description: The key was created.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/CreatedSourceKey"
    "400":
      description: The source ID is not a valid UUID, or the request body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "404":
      description: No source exists with that ID.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "409":
      description: The supplied key ID is already in use.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
    "422":
      description: The request body failed validation.
      content:
        application/json:
          schema:
            $ref: "../../../schemas.yml#/components/schemas/Error"
