services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["relay", "serve"]
    environment:
      PORT: "8080"
      # Persist the embedded SQLite database on the named volume mounted at the
      # container's working directory (/app).
      DATABASE_URL: "file:/app/relay.db"
      # Local-only default; not safe for production. Generate a real key with
      # `openssl rand -base64 32` and override for any shared environment.
      SECRETS_ENCRYPTION_KEY: "zDyU45SrX4e+F6jXLeAXfogo2DP749N9yhKWqUM4gvE="
    volumes:
      - relay-data:/app
    expose:
      - "8080"
    healthcheck:
      # 127.0.0.1, not localhost: localhost can resolve to ::1 first and an
      # IPv4-only listener then fails the probe.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  relay-data:
